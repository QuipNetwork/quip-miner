[package]
name = "quip-miner-core"
version = "0.3.0"
edition = "2021"
description = "Shared miner harness: gRPC session loop + Sampler trait for v0.3 miners"

[lib]
name = "quip_miner_core"
path = "src/lib.rs"

[dependencies]
quip-proto = { path = "../quip-proto" }
quip-protocol = { path = "../quip-protocol" }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
quip-mock-coordinator = { path = "../quip-mock-coordinator" }
serde_json = "1"
# test-util: `start_paused` clocks only advance while every task is idle, which
# is how `writer_parks_when_the_read_loop_closes_before_the_sampler` detects a
# busy-spinning writer.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "test-util"] }

[lints]
workspace = true
