[workspace]
resolver = "2"
members = ["crates/*"]
# The solver contract (quip-proto, quip-protocol, quip-solver-core, the PyO3
# wheel, and the conformance suite) lives in quip.network/quip-solver-core and
# is consumed from crates.io. This workspace keeps only the coordinator side.

[workspace.lints.rust]
missing-docs          = "warn"
nonstandard-style     = "warn"
redundant-lifetimes   = "warn"
rust-2018-idioms      = "deny"
unreachable-pub       = "warn"
unsafe-code           = "deny"
unused-extern-crates  = "warn"
unused-imports        = "warn"
unused-must-use       = "warn"
unused-qualifications = "warn"
unused-results        = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
unwrap-used           = "deny"
expect-used           = "warn"
panic                 = "deny"
panic-in-result-fn    = "deny"
unimplemented         = "deny"
indexing-slicing      = "warn"
# No cheating
allow-attributes      = "deny"
# Code hygiene
dbg-macro             = "warn"
todo                  = "deny"
print-stdout          = "deny"
print-stderr          = "deny"
redundant-clone       = "warn"
uninlined-format-args = "warn"
manual-string-new     = "warn"
use-self              = "warn"
# Safety
await-holding-lock    = "deny"
large-futures         = "deny"
exit                  = "deny"
mem-forget            = "deny"
# Pedantic relaxations (too noisy)
module-name-repetitions = "allow"
similar-names           = "allow"

[workspace.lints.rustdoc]
all = "warn"

[workspace.dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
